name: Build and publish dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run food access analysis
        env:
          FOOD_DATA_DIR: data
        run: python src/FinalDashboard.py

      - name: Assemble website
        run: |
          mkdir _site
          cp data/output3/food_access_dashboard.html _site/index.html
          cp data/output3/*.csv _site/

      - name: Keep full results (GeoPackage + CSVs) as a download
        uses: actions/upload-artifact@v4
        with:
          name: analysis-results
          path: data/output3/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
